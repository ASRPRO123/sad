name: Build MicroPython ESP32-S3 N16R8

# Builds MicroPython v1.29.0 for ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
# with ulab 6.12.1 and the built-in "translate" C module.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MPY_VERSION: v1.29.0          # MicroPython release tag (post2 is a PyPI suffix;
                                # source tarball on GitHub is tagged v1.29.0)
  ULAB_VERSION: 6.12.1          # micropython-ulab tag (NO 'v' prefix - upstream tags are plain)
  IDF_VERSION: v5.5.2           # Must match MicroPython's lockfile (5.5.2), not 5.4.1
  BOARD: ESP32_GENERIC_S3_N16R8

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout MicroPython source
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.MPY_VERSION }}
          path: micropython
          submodules: true

      - name: Checkout ulab
        uses: actions/checkout@v4
        with:
          repository: v923z/micropython-ulab
          ref: ${{ env.ULAB_VERSION }}
          path: ulab

      - name: Rebuild dictionary header from CSV
        working-directory: project
        run: python3 tools/build_dict.py dict/sample.csv modules/translate/dict_data.h

      - name: Install ESP-IDF
        run: |
          git clone -b ${{ env.IDF_VERSION }} --depth 1 --recursive \
            https://github.com/espressif/esp-idf.git /opt/esp-idf
          cd /opt/esp-idf
          ./install.sh esp32s3

      - name: Build mpy-cross
        run: |
          cd micropython/mpy-cross
          make -j"$(nproc)"

      - name: Install board definition and C modules into MicroPython tree
        run: |
          set -e
          # 1. Board files -> ports/esp32/boards/<BOARD>/
          mkdir -p "micropython/ports/esp32/boards/${{ env.BOARD }}"
          cp -v "project/boards/${{ env.BOARD }}/"* \
                "micropython/ports/esp32/boards/${{ env.BOARD }}/"

          # 2. partitions.csv -> ports/esp32/ (ESP-IDF resolves the custom
          #    partition filename relative to the project root)
          cp -v "project/boards/${{ env.BOARD }}/partitions.csv" \
                micropython/ports/esp32/partitions.csv

          # 3. translate C module -> ports/esp32/modules/translate
          mkdir -p micropython/ports/esp32/modules/translate
          cp -v project/modules/translate/*.c \
                project/modules/translate/*.h \
                project/modules/translate/micropython.cmake \
                micropython/ports/esp32/modules/translate/

          # 4. ulab C module -> ports/esp32/modules/ulab
          #    (ulab's micropython.cmake lives in its code/ directory)
          mkdir -p micropython/ports/esp32/modules/ulab
          cp -rv ulab/code/* micropython/ports/esp32/modules/ulab/

      - name: Build firmware
        run: |
          # shellcheck disable=SC1091
          source /opt/esp-idf/export.sh

          cd micropython/ports/esp32

          # No USER_C_MODULES needed - both modules are declared via
          # c_module() in the board's manifest.py (installed above).
          make BOARD="${{ env.BOARD }}" -j3

      - name: List build output
        run: |
          echo "=== All .bin files in build dir ==="
          find "micropython/ports/esp32/build-${{ env.BOARD }}" -name "*.bin" -exec ls -lh {} \;

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-${{ env.BOARD }}-translate
          path: |
            # All .bin files recursively (bootloader, partition-table, app, combined)
            micropython/ports/esp32/build-${{ env.BOARD }}/**/*.bin
          if-no-files-found: error
          retention-days: 30
